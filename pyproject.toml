[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openanchor"
version = "0.6.1"
description = "LLM token-attribution middleware with OTEL observability and semantic caching"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
keywords = ["llm", "cost-optimization", "middleware", "routing", "token-accounting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pytokencalc>=0.7.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0,<2.0",
    "opentelemetry-sdk>=1.20.0,<2.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "bandit>=1.7.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
"Homepage" = "https://github.com/Mullassery/openanchor"
"Bug Tracker" = "https://github.com/Mullassery/openanchor/issues"
"Documentation" = "https://github.com/Mullassery/openanchor/blob/main/README.md"
"Repository" = "https://github.com/Mullassery/openanchor.git"

[tool.setuptools.packages.find]
include = ["openanchor*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["planning", "docs", "build", "dist"]

[tool.ruff.lint]
# Deliberately scoped to pyflakes/pycodestyle-error/import-sort rather than
# ruff's much larger "ALL" rule surface (pyupgrade UP*, flake8-datetimez
# DTZ*, etc). Those flag real style/modernization opportunities but
# repo-wide adoption (e.g. migrating every `Dict[str, int]` to `dict[str,
# int]`, or every `datetime.utcnow()` to timezone-aware datetimes across
# models.py/collector.py) is a separate, deliberate refactor — not
# something to fold silently into a lint gate.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
