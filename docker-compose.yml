version: '3.8'

# OpenAnchor's actual storage layer is SQLite (see openanchor/storage.py) or
# in-memory — the package has no ClickHouse (or any other external
# database) integration anywhere in the code, so this file no longer
# pretends to run one. A previous version of this file spun up a
# clickhouse-server container and set DATABASE_URL, neither of which
# openanchor ever read.

services:
  openanchor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openanchor-app
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - openanchor_data:/app/data
    # Default image command runs the health server (see Dockerfile).
    # Uncomment to run the test suite instead:
    # command: python -m pytest tests/ --cov=openanchor

volumes:
  openanchor_data:
